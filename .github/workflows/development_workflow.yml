name: Development Workflow

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [master]

# A superseded run of the same ref has no value: stop it before it burns minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The build resolves the private framework snapshot from GitHub Packages, which needs a token.
permissions:
  contents: read
  packages: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Dependencies
        uses: ./.github/actions/setup

      - name: Run unit tests
        run: ./gradlew test
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '*/build/reports/tests/test/'
          retention-days: 14

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Dependencies
        uses: ./.github/actions/setup

      - name: Run integration tests
        run: ./gradlew :jobs:integrationTest
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: 'jobs/build/reports/tests/integrationTest/'
          retention-days: 14

  performance-tests:
    name: Performance tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Setup Dependencies
        uses: ./.github/actions/setup

      - name: Run performance tests
        run: ./gradlew :jobs:perfTest
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-test-reports
          path: 'jobs/build/reports/tests/perfTest/'
          retention-days: 14

  qodana:
    name: Qodana
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Dependencies
        uses: ./.github/actions/setup

      - name: Install the JDK the build toolchain expects
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: corretto

      # The project scans clean: no baseline is needed, a finding fails the job.
      # Two things the analysis container does not carry and the Gradle import needs: the JDK 21
      # the build declares as its toolchain, and the token reading the private framework snapshot.
      # Both are mounted/forwarded here; the step `env` only reaches the CLI, not the container.
      - name: Qodana Scan
        if: github.actor != 'dependabot[bot]'
        uses: JetBrains/qodana-action@v2026.2.0
        with:
          pr-mode: false
          upload-result: true
          args: |
            --volume ${{ env.JAVA_HOME_21_X64 }}:/opt/jdk-21
            --env JAVA_HOME=/opt/jdk-21
            --env GITHUB_ACTOR=${{ github.actor }}
            --env GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
          QODANA_ENDPOINT: 'https://qodana.cloud'
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-images:
    name: Docker images (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    needs: [unit-tests, integration-tests]
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Dependencies
        uses: ./.github/actions/setup

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # One image per executable module, on both architectures. The Gradle build runs once and its
      # distributions are shared by the five final stages.
      - name: Build every module image
        run: docker compose --profile migrate build
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show the built images
        run: docker image ls --filter 'reference=shikkanime/*' --format '{{.Repository}}:{{.Tag}} {{.Size}}'

      # Proves the runtime of an image end to end: JRE, schema provisioner and the Liquibase
      # wiring, without any service to keep alive.
      - name: Provision a schema from the database image
        run: docker run --rm shikkanime/core-database:local

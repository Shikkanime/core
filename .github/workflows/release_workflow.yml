name: Release workflow

on:
  workflow_dispatch:  # Allows manual triggering
    inputs:
      version:
        description: 'Version to release'
        required: true
      bypass_tests:
        description: 'Bypass tests failure. Default: false'
        required: false
        default: false
        type: boolean

# The release publishes one image per executable module: `shikkanime-core-<module>`. A deployment
# can then update a single module, `jobs` for instance, without pulling the others.
env:
  REGISTRY: ${{ vars.DOCKERHUB_USERNAME }}
  VERSION: ${{ github.event.inputs.version }}
  TAG: v${{ github.event.inputs.version }}
  MODULES: api site admin jobs database

jobs:
  test:
    name: Test release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup Dependencies
        uses: ./.github/actions/setup

      - name: Set the version
        run: sed -i "s/^version=.*/version=$VERSION/" gradle.properties

      - name: Run the test suites
        run: ./gradlew test :jobs:integrationTest :jobs:perfTest
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: ${{ github.event.inputs.bypass_tests == 'true' }}

  images:
    name: Images (${{ matrix.arch }})
    runs-on: ${{ matrix.platform }}
    needs: [ test ]
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        # Each architecture is built on its own runner: emulating arm64 would cost more than the
        # whole build. The manifests job merges both into a multi-architecture tag.
        include:
          - platform: ubuntu-latest
            arch: amd64
          - platform: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v7

      - name: Setup Dependencies
        uses: ./.github/actions/setup

      - name: Set the version
        run: sed -i "s/^version=.*/version=$VERSION/" gradle.properties

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The Gradle build runs once per runner and its distributions are shared by the five final
      # stages, so this loop costs one build plus five cheap copies.
      - name: Build and push every module image
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for module in $MODULES; do
            echo "::group::$module"
            docker buildx build \
              --target "$module" \
              --tag "$REGISTRY/shikkanime-core-$module:$VERSION-${{ matrix.arch }}" \
              --build-arg GITHUB_ACTOR \
              --build-arg GITHUB_TOKEN \
              --cache-from "type=registry,ref=$REGISTRY/shikkanime-core-$module:buildcache-${{ matrix.arch }}" \
              --cache-to "type=registry,ref=$REGISTRY/shikkanime-core-$module:buildcache-${{ matrix.arch }},mode=max" \
              --push \
              .
            echo "::endgroup::"
          done

  manifests:
    name: Publish the multi-architecture tags
    runs-on: ubuntu-latest
    needs: [ images ]
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Merge the architecture images
        run: |
          for module in $MODULES; do
            image="$REGISTRY/shikkanime-core-$module"
            docker buildx imagetools create \
              --tag "$image:$VERSION" \
              --tag "$image:latest" \
              "$image:$VERSION-amd64" \
              "$image:$VERSION-arm64"
          done

  push-commit:
    name: Push version commit
    runs-on: ubuntu-latest
    needs: [ manifests ]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Commit the version
        run: |
          sed -i "s/^version=.*/version=$VERSION/" gradle.properties
          git config user.name "GitHub Actions"
          git config user.email "github-actions@users.noreply.github.com"
          git commit -am "Update version to $VERSION"
          git push origin "HEAD:${{ github.ref_name }}"

  push-tag:
    name: Push Git Tag
    runs-on: ubuntu-latest
    needs: [ push-commit ]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Push the tag
        run: |
          git config user.name "GitHub Actions"
          git config user.email "github-actions@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

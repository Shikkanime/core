name: update-credentials

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      apk_vername: ${{ steps.apk_info.outputs.apk_vername }}
      apk_vercode: ${{ steps.apk_info.outputs.apk_vercode }}
      apk_download_path: ${{ steps.apk_info.outputs.apk_download_path }}
      new_version: ${{ steps.version_check.outputs.new_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch latest apk information
        id: apk_info
        run: |
          # endpoints extracted from https://github.com/vitalygashkov/crextractor
          apk_id="$(curl -X GET -s 'https://ws2-cache.aptoide.com/api/7/apps/search?query=crunchyroll&cdn=web&q=bXlDUFU9YXJtNjQtdjhhLGFybWVhYmktdjdhLGFybWVhYmkmbGVhbmJhY2s9MA&aab=1' | jq '.datalist.list.[0].id')"

          if [[ -z "$apk_id" || "$apk_id" == "null" || ! "$apk_id" =~ ^[0-9]+$ ]]; then
            echo "Failed to fetch apk id"
            exit 1
          fi

          apk_info="$(curl -X POST -s -d "identif=id%3A$apk_id&mode=json" https://webservices.aptoide.com/webservices/3/getApkInfo | jq .apk)"
          apk_vername=$(echo "$apk_info" | jq --raw-output .vername)
          apk_vercode=$(echo "$apk_info" | jq --raw-output .vercode)
          apk_download_path=$(echo "$apk_info" | jq --raw-output .path)

          if [[ -z "$apk_vername" || "$apk_vername" == "null" || ! "$apk_vername" =~ ^[A-Za-z0-9._-]+$ ||
                -z "$apk_vercode" || "$apk_vercode" == "null" || ! "$apk_vercode" =~ ^[0-9]+$ ||
                -z "$apk_download_path" || "$apk_download_path" == "null" ]]; then
            echo "Failed to fetch apk information"
            exit 1
          fi

          # Portable URL character set: no quotes or unbalanced brackets inside the class.
          url_re='^https://[A-Za-z0-9._~:/?#@!&()*+,;=%-]+$'
          if [[ ! "$apk_download_path" =~ $url_re ]]; then
            echo "Unexpected apk download path: $apk_download_path"
            exit 1
          fi

          echo "apk_vername=$apk_vername" >> $GITHUB_OUTPUT
          echo "apk_vercode=$apk_vercode" >> $GITHUB_OUTPUT
          echo "apk_download_path=$apk_download_path" >> $GITHUB_OUTPUT

      - name: Get current APK version from source
        id: source_info
        run: |
          source_version=$(grep -oP '(?<=CRUNCHYROLL_APK_VERSION = ").+(?=")' jobs/src/main/kotlin/platforms/impl/CrunchyrollPlatform.kt)
          echo "source_version=$source_version" >> $GITHUB_OUTPUT

      - name: Compare version
        id: version_check
        run: |
          if [ "${{ steps.apk_info.outputs.apk_vername }}_${{ steps.apk_info.outputs.apk_vercode }}" = "${{ steps.source_info.outputs.source_version }}" ]; then
            echo "APK version is the same, nothing to do"
            exit 0
          fi
          echo "Newer APK version found"
          echo "new_version=true" >> $GITHUB_OUTPUT

  update-credentials:
    runs-on: ubuntu-latest
    needs: check-version
    if: needs.check-version.outputs.new_version == 'true'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install jadx
        run: |
          # Pinned version; bump it deliberately after reviewing the release.
          JADX_VERSION=1.5.6

          curl -fsSL -o jadx.zip "https://github.com/skylot/jadx/releases/download/v$JADX_VERSION/jadx-$JADX_VERSION.zip"
          unzip jadx.zip -d jadx
          chmod +x "$(pwd)/jadx/bin/jadx"

          echo "$(pwd)/jadx/bin" >> $GITHUB_PATH

      - name: Download new apk
        run: |
          curl -fsSL -o crunchyroll-tv.apk "${{ needs.check-version.outputs.apk_download_path }}"

      - name: Extract apk credentials
        id: credentials
        run: |
          # Pinned to a reviewed commit of crunchy-labs/crunchyroll-scripts; bump it deliberately.
          credentials="$(curl -fsSL https://raw.githubusercontent.com/crunchy-labs/crunchyroll-scripts/316fc1f5e897130438271e4146b25b8c8b114415/apk-credentials-extract.sh | bash -s crunchyroll-tv.apk --info-stderr 2>&1)"
          apk_basic_auth_token="$(echo "$credentials" | grep -oP '(?<=basic auth credentials: ).+')"

          if [ -z "$apk_basic_auth_token" ]; then
            echo "Failed to extract the basic auth token from the APK"
            exit 1
          fi

          if [[ ! "$apk_basic_auth_token" =~ ^[A-Za-z0-9+/=]+$ ]]; then
            echo "Extracted token has an unexpected format"
            exit 1
          fi

          echo "apk_basic_auth_token=$apk_basic_auth_token" >> $GITHUB_OUTPUT

      - name: Update source
        run: |
          source_file="jobs/src/main/kotlin/platforms/impl/CrunchyrollPlatform.kt"

          NEW_TOKEN="${{ steps.credentials.outputs.apk_basic_auth_token }}" \
          NEW_VERSION="${{ needs.check-version.outputs.apk_vername }}_${{ needs.check-version.outputs.apk_vercode }}" \
          perl -0pi -e 's/(CRUNCHYROLL_BASIC_AUTH_TOKEN\s*=\s*")[^"]+/$1$ENV{NEW_TOKEN}/; s/(CRUNCHYROLL_APK_VERSION\s*=\s*")[^"]+/$1$ENV{NEW_VERSION}/' "$source_file"

          grep -q "CRUNCHYROLL_APK_VERSION = \"${{ needs.check-version.outputs.apk_vername }}_${{ needs.check-version.outputs.apk_vercode }}\"" "$source_file" || {
            echo "Failed to update CRUNCHYROLL_APK_VERSION in $source_file"
            exit 1
          }

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.USER_TOKEN }}
          add-paths: |
            jobs/src/main/kotlin/platforms/impl/CrunchyrollPlatform.kt
          commit-message: "[update-credentials action] Update Crunchyroll basic auth token"
          title: "Update Crunchyroll basic auth token"
          body: |
            Update the Crunchyroll basic auth token default value to match the latest Android TV APK (`${{ needs.check-version.outputs.apk_vername }}_${{ needs.check-version.outputs.apk_vercode }}`).
          base: master
          branch: update-crunchyroll-credentials-${{ needs.check-version.outputs.apk_vername }}_${{ needs.check-version.outputs.apk_vercode }}

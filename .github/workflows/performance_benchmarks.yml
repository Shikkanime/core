name: Performance Benchmarks

# The benchmarks also run on every pull request (see development_workflow.yml); this run keeps a
# weekly reference on a quiet machine, and allows measuring on demand.
on:
  workflow_dispatch:
  schedule:
    # Sunday at 04:00 UTC
    - cron: '0 4 * * 0'

permissions:
  contents: read
  packages: read

jobs:
  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Setup Dependencies
        uses: ./.github/actions/setup

      - name: Run performance benchmarks
        run: ./gradlew :jobs:perfTest --info
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-test-reports
          path: jobs/build/reports/tests/perfTest/
          retention-days: 14

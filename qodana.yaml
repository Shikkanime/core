####################################################################################################################
# WARNING: Do not store sensitive information in this file, as its contents will be included in the Qodana report. #
####################################################################################################################
version: "1.0"
linter: qodana-jvm-community
profile:
  name: qodana.recommended
exclude:
  # `:models` is the shared vocabulary of the applications: its declarations are consumed by the
  # modules and by the serialized payloads, never only inside the module, so an unused entry there
  # is not dead code.
  - name: UnusedSymbol
    paths:
      - models/src/main/kotlin
  # Quartz jobs are instantiated by the scheduler through Koin (`koin.getAll<Job>()`), so no
  # source reference to the job class exists for static analysis to follow.
  - name: UnusedSymbol
    paths:
      - jobs/src/main/kotlin/impl
  # Admin use case implementations are instantiated by Koin through their interface binding,
  # so no source reference to the impl class exists for static analysis to follow.
  - name: UnusedSymbol
    paths:
      - admin/src/main/kotlin/usecases/impl

name: shikkanime

# One image per executable module: updating a single module rebuilds and restarts only that
# service, for example `docker compose up -d --build jobs`.
services:
  api:
    image: shikkanime/core-api:local
    build:
      context: .
      target: api
      args:
        GITHUB_ACTOR: ${GITHUB_ACTOR:-}
        GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    ports:
      - "8080:8080"
    environment:
      - PORT=8080

  site:
    image: shikkanime/core-site:local
    build:
      context: .
      target: site
      args:
        GITHUB_ACTOR: ${GITHUB_ACTOR:-}
        GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    ports:
      - "8082:8082"
    environment:
      - PORT=8082

  admin:
    image: shikkanime/core-admin:local
    build:
      context: .
      target: admin
      args:
        GITHUB_ACTOR: ${GITHUB_ACTOR:-}
        GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    ports:
      - "8081:8081"
    environment:
      - PORT=8081

  jobs:
    image: shikkanime/core-jobs:local
    build:
      context: .
      target: jobs
      args:
        GITHUB_ACTOR: ${GITHUB_ACTOR:-}
        GITHUB_TOKEN: ${GITHUB_TOKEN:-}

  # Schema provisioner on its own, for a deployment that migrates before rolling out an
  # application image: `docker compose run --rm database`.
  database:
    image: shikkanime/core-database:local
    build:
      context: .
      target: database
      args:
        GITHUB_ACTOR: ${GITHUB_ACTOR:-}
        GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    profiles: [migrate]
